name: On Main Merge

on:
  push:
    branches:
      - main
      - release
      - ref/consistency-ref-implementation
  workflow_dispatch:

permissions:
  id-token: write
  pages: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Job 1: Generate the bot token and expose it as a job output.
  generate_token:
    runs-on: ubuntu-latest
    name: Generate Bot Token

    # 🚨 FIX 1: Define an output for this job to store the generated token.
    outputs:
      bot_token_out: ${{ steps.app_token.outputs.token }}

    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v1
        id: app_token
        with:
          app_id: ${{ secrets.BOT_ID }}
          private_key: ${{ secrets.BOT_SK }}

  on_main_merge:
    needs: generate_token
    name: Run On Merge Main Workflow
    uses: algorandfoundation/algokit-shared-config/.github/workflows/on-merge-main.yml@algorandfoundation/algokit-shared-config/.github/workflows/on-merge-main.yml@ref/consistency-ref-implementation
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BOT_TOKEN: ${{ needs.generate_token.outputs.bot_token_out }}
